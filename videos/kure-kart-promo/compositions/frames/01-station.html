  <script>
    (function () {
      var DUR = 4;
      var el = function (id) {

      var band = el("station01-band");
      var scrim = el("station01-scrim");
      var m1 = el("station01-m1");
      var m2 = el("station01-m2");
      var w1 = el("station01-w1");
      var w2 = el("station01-w2");
      var rule = el("station01-rule");
      var mark = el("station01-mark");
      var label = el("station01-label");

      /* ONE tempo grid drives every onset (kinetic-beat-slam: shared beat array). */
      var PULSE = 0.1;
      var BAND_IN = PULSE * 15; // 1.50 — scene 2: band wipes up
      var W1 = PULSE * 16; // 1.60 — beat 1 「実在の、」
      var W2 = PULSE * 19; // 1.90 — beat 2 「呉。」
      var SCRIM = PULSE * 24.5; // 2.45 — plate extends upward for the payoff
      var CUT = PULSE * 25; // 2.50 — HARD CUT word-swap, scene 3 begins
      var POP = PULSE * 30; // 3.00 — scene 4: wordmark payoff
      var LABEL = PULSE * 33; // 3.30 — small label

      var tl = gsap.timeline({ paused: true });

      /* ---- Scene 1 (0.0–1.5s): footage alone, zero type. Collapsed start states. ---- */
      tl.set(band, { clipPath: "inset(100% 0% 0% 0%)" }, 0);
      tl.set(scrim, { opacity: 0 }, 0);
      tl.set([m1, m2], { opacity: 1 }, 0);

      /* ---- Scene 2 (1.5–2.5s): band wipes up from below, two per-word beats land in it ---- */
      tl.fromTo(
        band,
        { clipPath: "inset(100% 0% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.out" },
        BAND_IN
      );

      // beat 1 — bottom-up masked rise, blur resolving sharp
      tl.fromTo(
        w1,
        { yPercent: 70, opacity: 0, filter: "blur(14px)" },
        { yPercent: 0, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" },
        W1
      );

      // beat 2 — oversized word scaling down to measure (distinct axis + ease)

        w2,
        { scale: 1.45, opacity: 0, filter: "blur(12px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" },
        W2
      );

      /* ---- Scene 3 (2.5–3.0s): HARD CUT word-swap — the line vanishes, the rule draws ---- */

      // the dark plate grows upward so the payoff has its own ground

      // 36x2 yellow rule stub drawn left -> right on the same baseline

      /* ---- Scene 4 (3.0–4.0s): spring-pop payoff over the rule (smooth settle), then HELD ---- */

        mark,
        { scale: 0.35, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.3)" },
        POP
      );
      tl.fromTo(
        label,
        { x: -14, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
        LABEL
      );

      // pin the timeline to the full frame duration (no idle loop — the type holds dead still)
      var span = { v: 0 };
